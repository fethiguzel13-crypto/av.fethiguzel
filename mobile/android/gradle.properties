# Project-wide Gradle settings.

# 1536m, R8 + API 36 kaynak birleştirmesi için yetersiz kalıyordu.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# configuration-cache bilinçli olarak KAPALI: Capacitor'ın ürettiği
# cordova.variables.gradle betiği yapılandırma anında dosya okuyor ve
# önbellekle uyumsuz. Derleme hızından çok derlemenin çalışması önemli.

android.useAndroidX=true

# R sınıfı yalnız kendi modülünün kaynaklarını taşısın — derleme süresi ve
# metot sayısı için. AGP 8'de varsayılan true, açıkça yazıyoruz.
android.nonTransitiveRClass=true
