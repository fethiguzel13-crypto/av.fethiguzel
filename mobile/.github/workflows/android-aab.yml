name: Build Android AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'fethiguzel-app/**'
      - '.github/workflows/android-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fethiguzel-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fethiguzel-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci || npm install

      - name: Generate icons
        run: npm run icons

      - name: Prepare web + Capacitor Android
        run: |
          npm run build:web
          npx cap add android || true
          npx cap sync android

      - name: Decode keystore (optional secret)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload.jks
          cat > android/keystore.properties <<EOF
          storeFile=../upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Configure release signing (if keystore present)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          # Append signing config via gradle snippet if not already present
          python3 <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          if 'signingConfigs' not in text:
              inject = '''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              text = text.replace('android {', inject + '\nandroid {', 1)
              text = text.replace(
                  'buildTypes {',
                  '''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }
              buildTypes {
          ''',
                  1,
              )
              text = text.replace(
                  'release {\n',
                  'release {\n            signingConfig signingConfigs.release\n',
                  1,
              )
              gradle.write_text(text)
          print('signing configured')
          PY

      - name: Build release bundle
        working-directory: fethiguzel-app/android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            fethiguzel-app/android/app/build/outputs/bundle/release/*.aab
            fethiguzel-app/assets/play-*.png
          if-no-files-found: warn
