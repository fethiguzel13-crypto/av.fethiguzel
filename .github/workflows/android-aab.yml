name: Build Android AAB

# Dört uygulamayı ayrı ayrı üretir. Önceki sürüm tek AAB üretiyor ve
# `|| ./gradlew assembleDebug` ile başarısız release derlemesini gizliyordu;
# iş akışı yeşil görünürken elde kullanılabilir bir çıktı olmuyordu.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Hangi uygulama? (all | portal | hesap | icthat | rehber)'
        required: false
        default: 'all'
  push:
    paths:
      - 'mobile/**'
      - 'content-packs/**'
      - 'lib/content-quality.mjs'
      - '.github/workflows/android-aab.yml'

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Ortak hazırlık: içerik paketleri ve dört arayüz derlemesi ──────────
  web:
    runs-on: ubuntu-latest
    outputs:
      # Hangi uygulamaların AAB'si üretilecek — katalogdan türetilir.
      # Sabit liste tutulursa, katalogda yayın durumu değiştiğinde matris
      # geride kalır ve ya yayınlanmayan bir uygulama derlenir ya da
      # yayınlanan biri hiç derlenmez.
      apps: ${{ steps.apps.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: İçerik kalitesi testleri
        run: node --test "lib/__tests__/*.test.mjs"

      - name: Uygulama paketlerini üret
        run: node scripts/build-app-packs.mjs

      # Hukuki Hesap uygulaması, 33 aracı iki kez yazmamak için portalın
      # gerçek `components/hesaplama/HesaplamaTools.tsx` dosyasını olduğu
      # gibi kullanır (mobile/vite.config.mjs → `@/…` takma adı). O dosya
      # kök `node_modules`'a ihtiyaç duyar (lucide-react gibi) — mobile/
      # içindeki npm ci bunu kurmaz, ikisi kardeş klasördür. Bu adım
      # olmadan "Dört arayüzü derle" hesap flavor'ında Rollup'ın
      # `lucide-react`'i çözemediği bir hatayla patlar.
      - name: Kök bağımlılıklar (paylaşılan bileşenler için)
        run: npm ci --no-audit --no-fund

      - name: Mobil bağımlılıklar
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Simgeler
        working-directory: mobile
        run: node scripts/generate-icons.mjs

      - name: Yayınlanan arayüzleri derle
        working-directory: mobile
        run: node scripts/build-app.mjs

      - name: Yayınlanan uygulamaları belirle
        id: apps
        run: |
          LIST=$(node -p "JSON.stringify(require('./mobile/galaxy/catalog.json').apps.filter(a => a.published === true).map(a => a.id))")
          echo "Yayınlanacak: $LIST"
          if [ "$LIST" = "[]" ]; then
            echo "::error::katalogda published:true olan uygulama yok"
            exit 1
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Derleme betiği testleri
        working-directory: mobile
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-www
          path: |
            mobile/flavors/*/www/**
            mobile/assets/icons/**
          retention-days: 3
          if-no-files-found: error

  # ── 2. Uygulama başına AAB ───────────────────────────────────────────────
  aab:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.web.outputs.apps) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Capacitor 7 kaynak uyumluluğu Java 21. Önceki sürüm Java 17
      # kuruyordu ve derleme "invalid source release: 21" ile kırılıyordu.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/download-artifact@v4
        with:
          name: galaxy-www
          path: mobile

      - name: Mobil bağımlılıklar
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: İmza anahtarı
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 gizli anahtarı yok — imzalı AAB üretilemez"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > upload.jks
          # Mutlak yol kullanılır: android/app/build.gradle bu değeri kendi
          # proje dizinine (android/app/) göre çözer, keystore.properties'in
          # bulunduğu android/'e göre değil. Göreli "../upload.jks" bu yüzden
          # bir klasör yanlış hesaplanıyordu (android/upload.jks) ve Gradle
          # dosyayı bulamayınca hata vermeden sessizce imzasız derliyordu.
          cat > android/keystore.properties <<EOF
          storeFile=$(pwd)/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Flavor etkinleştir — ${{ matrix.app }}
        working-directory: mobile
        run: node scripts/build-flavor.mjs --app=${{ matrix.app }}

      - name: Capacitor senkronu
        working-directory: mobile
        run: npx cap sync android

      # Yayın kapısı: burada durursa AAB üretilmez. Bilinçli olarak
      # gradle'dan ÖNCE çalışır — 10 dakikalık derlemeyi baştan harcamamak için.
      - name: Yayın doğrulaması
        working-directory: mobile
        run: node scripts/verify-release.mjs --app=${{ matrix.app }}

      - name: AAB üret
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Çıktıyı doğrula
        working-directory: mobile/android
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::AAB üretilmedi"
            exit 1
          fi
          SIZE=$(stat -c%s "$AAB")
          echo "AAB: $AAB ($((SIZE/1024)) KB)"
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::AAB şüpheli derecede küçük ($SIZE bayt) — içerik paketlenmemiş olabilir"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.app }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/mapping/release/mapping.txt
            mobile/assets/icons/${{ matrix.app }}-*.png
            mobile/store-listing/${{ matrix.app }}/**
          if-no-files-found: error
          retention-days: 30
