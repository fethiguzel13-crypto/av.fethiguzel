<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Madde Şerhi | Av. Fethi Güzel</title>
  <meta name="description" content="Resmî madde metni ve akademik şerh — Av. Fethi Güzel dijital hukuk kütüphanesi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --primary:#2E4036; --accent:#CC5833; --cream:#F2F0E9; --charcoal:#1A1A1A; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:var(--cream); color:var(--charcoal); }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { max-width:48rem; margin:0 auto; padding:2rem 1.25rem 4rem; }
    .nav { font-size:0.75rem; color:rgba(26,26,26,.5); margin-bottom:2rem; }
    .nav a { color:inherit; }
    .nav a:hover { color:var(--accent); }
    .kanun { color:var(--accent); font-size:10px; letter-spacing:.25em; text-transform:uppercase; font-weight:700; margin-bottom:.5rem; }
    h1 { font-family:Outfit,system-ui,sans-serif; font-size:clamp(1.6rem,4vw,2.25rem); margin:0 0 2rem; line-height:1.2; }
    .official { background:var(--primary); color:rgba(242,240,233,.95); border-radius:2rem; padding:2rem; margin-bottom:1.5rem; box-shadow:0 20px 50px -16px rgba(26,26,26,.2); }
    .official h2, .commentary h2 { font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); margin:0 0 1.25rem; }
    .commentary { background:#fff; border:1px solid rgba(26,26,26,.08); border-radius:2rem; padding:2rem; }
    .prose p { line-height:1.85; margin:0 0 1rem; }
    .prose h3 { margin:1.5rem 0 .75rem; font-family:Outfit,sans-serif; }
    .prose strong { color:var(--accent); }
    .official .prose strong { color:var(--accent); }
    .pulse { animation:pulse 1.2s ease-in-out infinite; }
    .pulse > div { background:rgba(26,26,26,.08); border-radius:1rem; margin-bottom:1rem; }
    @keyframes pulse { 50% { opacity:.55; } }
    .err { background:#fff; border:1px solid #fecaca; border-radius:1rem; padding:1.5rem; }
    .err pre { white-space:pre-wrap; font-size:12px; background:rgba(26,26,26,.05); padding:1rem; border-radius:.75rem; }
    header.top { background:rgba(242,240,233,.9); border-bottom:1px solid rgba(26,26,26,.06); padding:1rem 1.25rem; position:sticky; top:0; backdrop-filter:blur(10px); z-index:10; }
    header.top .inner { max-width:48rem; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:1rem; }
    header.top strong { font-family:Outfit,sans-serif; }
  </style>
</head>
<body>
  <header class="top">
    <div class="inner">
      <strong><a href="/" style="color:inherit;text-decoration:none">Av. Fethi Güzel</a></strong>
      <a href="/mevzuat">Mevzuat</a>
    </div>
  </header>
  <div class="wrap">
    <nav class="nav" id="crumb">
      <a href="/">Ana Sayfa</a> / <a href="/mevzuat">Mevzuat</a> / <span id="crumb-tail">Madde</span>
    </nav>
    <div id="app">
      <div class="pulse">
        <div style="height:2.5rem;width:66%"></div>
        <div style="height:16rem;background:rgba(46,64,54,.15)"></div>
        <div style="height:24rem"></div>
      </div>
    </div>
  </div>
  <script>
(function () {
  function parseIds() {
    var path = location.pathname.replace(/\/+$/, '');
    // /mevzuat/tmk/madde-1 or /mevzuat-viewer.html
    var m = path.match(/\/mevzuat\/([^/]+)\/([^/]+)$/);
    if (m && m[1] !== 'goster') {
      return { kanunId: decodeURIComponent(m[1]), id: decodeURIComponent(m[2]) };
    }
    var q = new URLSearchParams(location.search);
    return { kanunId: q.get('kanunId') || '', id: q.get('id') || '' };
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function mdToHtml(md) {
    var html = escapeHtml(md || '');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html = html.replace(/^(?!<h[1-3]>)(.+)$/gm, function (line) {
      var t = line.trim();
      if (!t) return '';
      if (t.charAt(0) === '<') return t;
      return '<p>' + t + '</p>';
    });
    return html;
  }

  async function gunzipToText(buf) {
    if (typeof DecompressionStream !== 'undefined') {
      var ds = new DecompressionStream('gzip');
      var stream = new Response(buf).body.pipeThrough(ds);
      return await new Response(stream).text();
    }
    throw new Error('Tarayıcı gzip desteklemiyor');
  }

  async function main() {
    var app = document.getElementById('app');
    var ids = parseIds();
    if (!ids.kanunId || !ids.id) {
      app.innerHTML = '<div class="err"><h1>Madde parametreleri eksik</h1><p>Lütfen <a href="/mevzuat">mevzuat listesinden</a> bir madde seçin.</p></div>';
      return;
    }
    document.getElementById('crumb-tail').textContent = ids.kanunId + '/' + ids.id;
    try {
      var res = await fetch('/content-packs/' + encodeURIComponent(ids.kanunId) + '.json.gz', { cache: 'force-cache' });
      if (!res.ok) throw new Error('Pack HTTP ' + res.status);
      var buf = await res.arrayBuffer();
      var bytes = new Uint8Array(buf);
      var isGzip = bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
      var jsonText = isGzip ? await gunzipToText(buf) : new TextDecoder().decode(buf);
      var pack = JSON.parse(jsonText);
      var article = pack[ids.id];
      if (!article) throw new Error('Madde pack içinde yok: ' + ids.kanunId + '/' + ids.id);
      document.title = article.title + ' | Av. Fethi Güzel';
      var commentary = article.commentary
        ? '<section class="commentary"><h2>AKADEMİK YORUM VE ANALİZ</h2><article class="prose">' + mdToHtml(article.commentary) + '</article></section>'
        : '';
      app.innerHTML =
        '<p class="kanun">' + escapeHtml(article.kanun || ids.kanunId) + '</p>' +
        '<h1>' + escapeHtml(article.title) + '</h1>' +
        '<section class="official"><h2>RESMİ METİN</h2><article class="prose">' + mdToHtml(article.official) + '</article></section>' +
        commentary;
    } catch (e) {
      app.innerHTML = '<div class="err"><h1>İçerik yüklenemedi</h1><p>' + escapeHtml(ids.kanunId + '/' + ids.id) + '</p><pre>' + escapeHtml(e && e.message ? e.message : String(e)) + '</pre><p><a href="/mevzuat">← Mevzuata dön</a></p></div>';
    }
  }
  main();
})();
  </script>
</body>
</html>
